drop-empty-elements: no
quiet: yes
markup: no
new-blocklevel-tags: md-button, md-content, md-divider, md-icon, md-list, md-list-item, md-subheader, md-tab, md-tab-label, md-tabs, md-toolbar
# Angular fills empty elements (ng-init spans) at runtime; keep them rather
# than warning about trimming.
drop-empty-paras: no
