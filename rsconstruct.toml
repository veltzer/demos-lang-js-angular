# rsconstruct configuration for this repository — shared defaults plus
# repo-specific config (merged from the former rsconstruct.local.toml).

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.markdown]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

# Convention: tera configs are Lua (config/*.lua). dep_auto entries are
# silently skipped where absent. Repos still on config/*.py keep a
# dep_inputs override in their local overlay until converted.
[processor.tera]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
	"config/github.lua",
	"config/python.lua",
	"config/shared.lua",
]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.rumdl]
src_dirs = ["src"]

[processor.zspell]
src_dirs = ["src"]

# ─── python ──────────────────────────────────────────────────────────────────

[processor.ruff]
src_dirs = ["src"]

[processor.pylint]
src_dirs = ["src"]

[processor.mypy]
src_dirs = ["src"]

[processor.requirements]
src_dirs = ["src"]

# ─── shell ───────────────────────────────────────────────────────────────────

[processor.shellcheck]
src_dirs = ["src"]
args = ["--severity=error", "--shell=bash"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

[processor.htmlhint]
src_dirs = ["src"]

[processor.tidy]
src_dirs = ["src"]
args = ["-config", "support/tidy.conf"]
# These two use Angular Material's layout attributes (layout=, flex=), which
# are framework markup tidy has no allowlist for. The pydmt-era Makefile had
# tidy disabled for the whole repo (only htmlhint ran); everything except
# these two files is now tidy-checked.
src_exclude_paths = ["src/material/header.html", "src/material/toolbar.html"]
